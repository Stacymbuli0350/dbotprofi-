<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DBotProfit Live Analysis</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#f4f7fb;
  color:#111827;
}

header{
  background:#075985;
  color:white;
  padding:18px;
  text-align:center;
}

header h1{
  font-size:24px;
  margin-bottom:6px;
}

.status{
  font-size:13px;
}

.container{
  max-width:900px;
  margin:auto;
  padding:15px;
}

.card{
  background:white;
  border-radius:14px;
  padding:16px;
  margin-bottom:15px;
  box-shadow:0 3px 12px rgba(0,0,0,.08);
}

label{
  font-size:13px;
  font-weight:bold;
  display:block;
  margin-bottom:7px;
}

select,
button{
  width:100%;
  padding:12px;
  border-radius:9px;
  border:1px solid #d1d5db;
  font-size:15px;
}

button{
  background:#075985;
  color:white;
  border:none;
  font-weight:bold;
  cursor:pointer;
}

.market-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}

.stat-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}

.stat{
  background:#f8fafc;
  border-radius:10px;
  padding:14px;
  text-align:center;
}

.stat-title{
  font-size:12px;
  color:#64748b;
  margin-bottom:6px;
}

.stat-value{
  font-size:22px;
  font-weight:bold;
}

.section-title{
  font-size:17px;
  font-weight:bold;
  margin-bottom:12px;
}

.range-buttons{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
}

.range-buttons button{
  background:#e2e8f0;
  color:#0f172a;
}

.range-buttons button.active{
  background:#075985;
  color:white;
}

canvas{
  width:100%;
  height:250px;
  display:block;
}

.digits{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
}

.digit{
  width:38px;
  height:38px;
  border-radius:50%;
  background:#e2e8f0;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:bold;
}

.analysis-row{
  display:flex;
  justify-content:space-between;
  padding:10px 0;
  border-bottom:1px solid #e5e7eb;
}

.analysis-row:last-child{
  border-bottom:none;
}

.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

footer{
  text-align:center;
  padding:20px;
  font-size:12px;
  color:#64748b;
}

@media(max-width:500px){
  .container{
    padding:10px;
  }

  .market-grid{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<header>
  <h1>DBotProfit</h1>

  <div class="status" id="status">
    ● Connecting...
  </div>
</header>

<div class="container">

  <div class="card">

    <label for="market">
      Synthetic Market
    </label>

    <select id="market">

      <option value="1HZ10V">
        Volatility 10 (1s)
      </option>

      <option value="1HZ25V">
        Volatility 25 (1s)
      </option>

      <option value="1HZ50V">
        Volatility 50 (1s)
      </option>

      <option value="1HZ75V">
        Volatility 75 (1s)
      </option>

      <option value="1HZ100V">
        Volatility 100 (1s)
      </option>

    </select>

  </div>

  <div class="card">

    <div class="section-title">
      Market Data
    </div>

    <div class="stat-grid">

      <div class="stat">

        <div class="stat-title">
          PRICE
        </div>

        <div class="stat-value" id="price">
          --
        </div>

      </div>

      <div class="stat">

        <div class="stat-title">
          LAST DIGIT
        </div>

        <div class="stat-value" id="lastDigit">
          --
        </div>

      </div>

    </div>

  </div>

  <div class="card">

    <div class="section-title">
      Price Chart
    </div>

    <canvas id="chart"></canvas>

  </div>

  <div class="card">

    <div class="section-title">
      Digit Analysis
    </div>

    <div class="range-buttons">

      <button class="range active" data-range="20">
        20
      </button>

      <button class="range" data-range="50">
        50
      </button>

      <button class="range" data-range="100">
        100
      </button>

    </div>

    <br>

    <div class="analysis-row">
      <span>MATCHES</span>
      <strong id="matches">--</strong>
    </div>

    <div class="analysis-row">
      <span>DIFFERS</span>
      <strong id="differs">--</strong>
    </div>

    <div class="analysis-row">
      <span>EVEN</span>
      <strong id="even">--</strong>
    </div>

    <div class="analysis-row">
      <span>ODD</span>
      <strong id="odd">--</strong>
    </div>

    <div class="analysis-row">
      <span>OVER</span>
      <strong id="over">--</strong>
    </div>

    <div class="analysis-row">
      <span>UNDER</span>
      <strong id="under">--</strong>
    </div>

  </div>

  <div class="card">

    <div class="section-title">
      Recent Digits
    </div>

    <div class="digits" id="recentDigits"></div>

  </div>

  <div class="card">

    <div class="section-title">
      Market Status
    </div>

    <div class="analysis-row">
      <span>Connection</span>

      <strong id="marketStatus">
        CONNECTING
      </strong>
    </div>

  </div>

  <div class="card">

    <div class="actions">

      <button id="openDeriv">
        Open Deriv
      </button>

      <button id="refresh">
        Refresh
      </button>

    </div>

  </div>

</div>

<footer>
  © 2026 DBotProfit — Live Analysis Workspace
</footer>

<script>const WS_URL =
"wss://api.derivws.com/trading/v1/options/ws/public";

let ws = null;

let selectedSymbol = "1HZ10V";

let digits = [];
let prices = [];

let selectedRange = 20;

const statusEl =
document.getElementById("status");

const marketStatusEl =
document.getElementById("marketStatus");

const priceEl =
document.getElementById("price");

const lastDigitEl =
document.getElementById("lastDigit");

const marketEl =
document.getElementById("market");

function connect(){

  if(ws){
    try{
      ws.close();
    }catch(e){}
  }

  statusEl.textContent =
  "● Connecting...";

  marketStatusEl.textContent =
  "CONNECTING";

  ws = new WebSocket(WS_URL);

  ws.onopen = function(){

    statusEl.textContent =
    "● Connected";

    marketStatusEl.textContent =
    "ONLINE";

    requestHistory();
    subscribeTicks();

  };

  ws.onmessage = function(event){

    try{

      const data =
      JSON.parse(event.data);

      if(data.history){

        const history =
        data.history;

        digits = [];
        prices = [];

        const list =
        history.prices || [];

        const pipSize =
        history.pip_size || 2;

        list.forEach(function(price){

          const value =
          Number(price);

          prices.push(value);

          digits.push(
            getLastDigit(value,pipSize)
          );

        });

        drawAnalysis();
        drawRecent();
        drawChart();

      }

      if(data.tick){

        const tick =
        data.tick;

        const quote =
        Number(tick.quote);

        const pipSize =
        tick.pip_size || 2;

        const digit =
        getLastDigit(quote,pipSize);

        priceEl.textContent =
        quote;

        lastDigitEl.textContent =
        digit;

        prices.push(quote);
        digits.push(digit);

        if(prices.length > 100){
          prices.shift();
        }

        if(digits.length > 100){
          digits.shift();
        }

        drawAnalysis();
        drawRecent();
        drawChart();

      }

    }catch(error){

      console.log(error);

    }

  };

  ws.onerror = function(){

    statusEl.textContent =
    "● CONNECTION ERROR";

    marketStatusEl.textContent =
    "OFFLINE";

  };

  ws.onclose = function(){

    statusEl.textContent =
    "● Disconnected";

    marketStatusEl.textContent =
    "OFFLINE";

  };

}

function requestHistory(){

  if(!ws ||
     ws.readyState !== WebSocket.OPEN){
    return;
  }

  ws.send(JSON.stringify({

    ticks_history:
    selectedSymbol,

    end:"latest",

    count:100,

    style:"ticks"

  }));

}

function subscribeTicks(){

  if(!ws ||
     ws.readyState !== WebSocket.OPEN){
    return;
  }

  ws.send(JSON.stringify({

    ticks:
    selectedSymbol,

    subscribe:1

  }));

}

function getLastDigit(quote,pipSize){

  const fixed =
  Number(quote).toFixed(pipSize);

  const clean =
  fixed.replace(/[^0-9]/g,"");

  return Number(
    clean.charAt(clean.length - 1)
  );

}

function calculateRange(range){

  const data =
  digits.slice(-range);

  if(data.length === 0){

    return {
      matches:0,
      differs:0,
      even:0,
      odd:0,
      over:0,
      under:0
    };

  }

  const counts = {};

  data.forEach(function(digit){

    counts[digit] =
    (counts[digit] || 0) + 1;

  });

  let highest =
  Math.max(
    ...Object.values(counts)
  );

  let matches =
  (highest / data.length) * 100;

  let differs =
  100 - matches;

  let evenCount =
  data.filter(
    d => d % 2 === 0
  ).length;

  let oddCount =
  data.length - evenCount;

  let overCount =
  data.filter(
    d => d > 4
  ).length;

  let underCount =
  data.filter(
    d => d < 5
  ).length;

  return {

    matches:matches,

    differs:differs,

    even:
    (evenCount / data.length) * 100,

    odd:
    (oddCount / data.length) * 100,

    over:
    (overCount / data.length) * 100,

    under:
    (underCount / data.length) * 100

  };

}

function drawAnalysis(){

  const result =
  calculateRange(selectedRange);

  document.getElementById("matches")
  .textContent =
  result.matches.toFixed(1) + "%";

  document.getElementById("differs")
  .textContent =
  result.differs.toFixed(1) + "%";

  document.getElementById("even")
  .textContent =
  result.even.toFixed(1) + "%";

  document.getElementById("odd")
  .textContent =
  result.odd.toFixed(1) + "%";

  document.getElementById("over")
  .textContent =
  result.over.toFixed(1) + "%";

  document.getElementById("under")
  .textContent =
  result.under.toFixed(1) + "%";

}

function drawRecent(){

  const box =
  document.getElementById(
    "recentDigits"
  );

  box.innerHTML = "";

  digits.slice(-20)
  .reverse()
  .forEach(function(digit){

    const item =
    document.createElement("div");

    item.className =
    "digit";

    item.textContent =
    digit;

    box.appendChild(item);

  });

}function resizeCanvas(){

  const canvas =
  document.getElementById("chart");

  const rect =
  canvas.getBoundingClientRect();

  const ratio =
  window.devicePixelRatio || 1;

  canvas.width =
  rect.width * ratio;

  canvas.height =
  rect.height * ratio;

  const ctx =
  canvas.getContext("2d");

  ctx.scale(ratio,ratio);

}

function drawChart(){

  const canvas =
  document.getElementById("chart");

  const ctx =
  canvas.getContext("2d");

  const width =
  canvas.clientWidth;

  const height =
  canvas.clientHeight;

  if(!width || !height){
    return;
  }

  ctx.clearRect(
    0,
    0,
    width,
    height
  );

  if(prices.length < 2){
    return;
  }

  const data =
  prices.slice(-100);

  const min =
  Math.min(...data);

  const max =
  Math.max(...data);

  const range =
  max - min || 1;

  ctx.beginPath();

  data.forEach(function(value,index){

    const x =
    (index / (data.length - 1))
    * width;

    const y =
    height -
    ((value - min) / range)
    * (height - 20) -
    10;

    if(index === 0){
      ctx.moveTo(x,y);
    }else{
      ctx.lineTo(x,y);
    }

  });

  ctx.strokeStyle =
  "#075985";

  ctx.lineWidth = 2;

  ctx.stroke();

}

marketEl.addEventListener(
  "change",
  function(){

    selectedSymbol =
    this.value;

    digits = [];
    prices = [];

    priceEl.textContent =
    "--";

    lastDigitEl.textContent =
    "--";

    connect();

  }
);

document
.querySelectorAll(".range")
.forEach(function(button){

  button.addEventListener(
    "click",
    function(){

      document
      .querySelectorAll(".range")
      .forEach(function(btn){

        btn.classList.remove(
          "active"
        );

      });

      this.classList.add(
        "active"
      );

      selectedRange =
      Number(
        this.dataset.range
      );

      drawAnalysis();

    }
  );

});

document
.getElementById("openDeriv")
.addEventListener(
  "click",
  function(){

    window.open(
      "https://t.deriv.link?t=BDLEFSWB873B",
      "_blank"
    );

  }
);

document
.getElementById("refresh")
.addEventListener(
  "click",
  function(){

    location.reload();

  }
);

window.addEventListener(
  "resize",
  function(){

    resizeCanvas();
    drawChart();

  }
);

resizeCanvas();

drawAnalysis();

drawRecent();

connect();
</script>

</body>
</html>
